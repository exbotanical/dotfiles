<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Ubuntu enables this rule system-wide and Arch does not, so both laptops get it here. Append, as
     the system rule does, leaves the value a desktop environment sets in first place. -->
<fontconfig>
  <match target="pattern">
    <edit name="rgba" mode="append"><const>rgb</const></edit>
  </match>
</fontconfig>
