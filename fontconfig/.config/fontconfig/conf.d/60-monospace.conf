<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig 2.18 ranks Noto Sans Mono above DejaVu Sans Mono for monospace, while 2.15 (Ubuntu
     24.04) ranks DejaVu Sans Mono first. 50-user.conf loads this file before 60-latin.conf, and the
     earlier prefer wins, so both laptops resolve monospace to DejaVu Sans Mono. -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
