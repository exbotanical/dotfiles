<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- microsoft-identity-broker installs Segoe UI on the work laptop only, and web pages that name it
     would render differently there. Rejecting it makes those pages fall through to the same font on
     both laptops. -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Segoe UI</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
