############################
###    Initialization    ###
############################

# Status bar
exec        --no-startup-id eww daemon && eww open bar

# GTK settings, written by ~/.xprofile
exec        --no-startup-id xsettingsd -c $HOME/.cache/xsettingsd.conf

# Compositor
exec_always --no-startup-id picom --config $CONFIG_DIR/picom/picom.conf --log-file $HOME/.cache/picom.log

# Notification daemon
exec        --no-startup-id dunst -config $CONFIG_DIR/dunst/dunstrc

# Color temperature (the night.timer user unit re-applies it every two minutes)
exec        --no-startup-id night apply

# Wallpaper
exec        --no-startup-id wallpaper
