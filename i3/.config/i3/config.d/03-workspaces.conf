##########################
###     Workspaces     ###
##########################

# Workspace to monitor assignments
exec_always --no-startup-id i3-msg "workspace $WS_BROWSER,    move workspace to output $MON_PRIMARY"
exec_always --no-startup-id i3-msg "workspace $WS_OBSIDIAN,   move workspace to output $MON_PRIMARY"
exec_always --no-startup-id i3-msg "workspace $WS_CODE,       move workspace to output $MON_PRIMARY"

# Auto-launch applications on startup
exec --no-startup-id i3-msg 'workspace $WS_BROWSER;  exec brave'
exec --no-startup-id i3-msg 'workspace $WS_OBSIDIAN; exec obsidian'
exec --no-startup-id i3-msg 'workspace $WS_CODE;     exec codium'

# Window to workspace assignments

# Criteria are unanchored, case-sensitive regexes.
# The VSCodium class is "codium" or "VSCodium" depending on the package,
# and its title ends in the workspace root name (see window.title in the VSCodium settings).
for_window [class="^Brave-browser$"]                                      move to workspace $WS_BROWSER
for_window [class="^obsidian$"]                                           move to workspace $WS_BROWSER
for_window [class="(?i)^(vs)?codium$"]                                    move to workspace $WS_CODE
for_window [class="(?i)^(vs)?codium$" title="(^| - )dotfiles(-public)?$"] move to workspace $WS_CODE_2
