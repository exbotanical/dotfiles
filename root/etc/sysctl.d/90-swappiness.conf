# At the default of 60 the kernel moves idle program memory to swap while
# gigabytes of page cache remain reclaimable, and on the Ubuntu laptop it paged
# out part of Xorg. The X input thread then waited on swap reads, and libinput
# logged "event processing lagging behind ... your system is too slow". A lower
# value makes the kernel treat swap IO as more expensive than dropping file
# cache, so it reclaims the cache first and swaps only under real pressure.
vm.swappiness = 10
