# autorandr records no gamma in the saved profiles, so applying one passes
# --gamma 1.0:1.0:1.0 and erases the redshift ramp. Skipping the option removes
# it from both the comparison and the applied command, so the "Config already
# loaded" exit is reached on charger and lid events.
#
# The empty ExecStart= is required: Type=oneshot appends ExecStart lines instead
# of replacing them.

[Service]
ExecStart=
ExecStart=/usr/bin/autorandr --batch --change --default default --skip-options gamma
