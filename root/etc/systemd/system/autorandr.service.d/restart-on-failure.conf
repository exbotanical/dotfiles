# autorandr 1.14 and 1.15 read /proc/<pid>/environ of every process to find the X
# sessions, and a process that exits during that scan raises ProcessLookupError and
# ends the run before any profile is applied, so an unplug can leave the previous
# layout in place. A second run rescans /proc. The fix is upstream in
# phillipberndt/autorandr#430, unreleased as of 1.15.

[Service]
Restart=on-failure
RestartSec=1
