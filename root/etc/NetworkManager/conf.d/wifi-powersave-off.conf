# With Wi-Fi power save on, MediaTek MT7925 cards (mt7925e) lose the link and
# NetworkManager fails with 'ssid-not-found' while the network is in range.
# Ubuntu's network-manager package turns power save on in
# default-wifi-powersave-on.conf; Arch's package sets no value, and this file sets
# it off on both. NetworkManager reads conf.d in ASCII order and the last
# value wins; digits sort before letters, so this name has no numeric prefix and
# sorts after the packaged file. 2 disables power save.

[connection]
wifi.powersave = 2
