# networkmanager_dmenu runs an interactive first-run setup when this file is missing, which blocks
# a launch from the eww bar. Unset options take the defaults in the upstream config.ini.example.
[dmenu]
dmenu_command = rofi -i
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name}  {sec}

[dmenu_passphrase]
# Passes -password to rofi so the passphrase is not shown while it is typed.
obscure = True

[editor]
terminal = alacritty
