name: Install Integration Workflow

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  integ_job:
    runs-on: ubuntu-latest
    name: Install on ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, arch]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install integration test
        run: ./.dev/run-integ.bash ${{ matrix.distro }}
