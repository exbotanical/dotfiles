import = ["~/.config/alacritty/themes/ghost.toml"]

[bell]
animation = "EaseOutCubic"
color = "#282e3a"
duration = 1

[cursor]
blink_interval = 750

[cursor.style]
blinking = "Always"
shape = "Beam"

[env]
TERM = "xterm-256color"

[font]
size = 10.0

[font.normal]
family = "FiraCode Nerd Font"

[window]
opacity = 0.95

[window.padding]
x = 6
y = 6

[shell]
program = "bash"
args = ["--login"]
