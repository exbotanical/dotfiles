# Defaults for every autorandr run: the udev hotplug service, i3's exec_always, and
# manual runs. A flag given on the command line overrides the value here.
#
# match-edid: a DisplayLink dock creates one evdi card per monitor when it is
# plugged in, and the order of creation decides which monitor is DVI-I-1-1 and
# which is DVI-I-2-2. Two identical monitors therefore swap names between plug-ins,
# and matching by output name fails to detect the profile.
#
# skip-options gamma: autorandr records no gamma in the saved profiles, so applying
# one passes --gamma 1.0:1.0:1.0 and erases the redshift ramp.
#
# skip-options crtc: CRTC numbers depend on how many evdi cards exist, so a profile
# saved with one card count names CRTCs that do not exist with another, and xrandr
# rejects the whole profile.

[config]
match-edid = true
skip-options = gamma,crtc
